services:
  test-certs-site:
    build: .
    volumes:
      - test-certs-site-config:/config:ro
      - pebble-certs:/pebble-certs:ro
      - test-certs-data:/data
    environment:
      LEGO_CA_CERTIFICATES: /pebble-certs/pebble.minica.pem
    command: ["/test-certs-site", "-config", "/config/test-certs-site-config.json"]
    depends_on:
      configgen:
        condition: service_completed_successfully
    ports:
      - "5001:5001"
      - "9001:9001"
    networks:
      testnet:
        aliases:
          - valid.localhost
          - revoked.localhost
          - expired.localhost

  configgen:
    build:
      context: .
      dockerfile: integration/configgen/Dockerfile
    volumes:
      - test-certs-site-config:/config
    command:
      - "-roots-url=https://pebble:15000/roots/0"
      - "-output=/config/test-certs-site-config.json"
    depends_on:
      - pebble
    networks:
      - testnet

  pebble:
    image: ghcr.io/letsencrypt/pebble
    command: -config /pebble-config.json
    volumes:
      - ./integration/pebble-config.json:/pebble-config.json
      - pebble-certs:/test/certs
    ports:
      - "14000:14000"
      - "15000:15000"
    networks:
      - testnet

networks:
  testnet:
    driver: bridge


volumes:
  test-certs-data:
  test-certs-site-config:
  pebble-certs:
